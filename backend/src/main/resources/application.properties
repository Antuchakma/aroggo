spring.application.name=aroggo-backend

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aroggo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aroggo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# JWT
jwt.secret=${JWT_SECRET:change_me_in_production_min_32_chars_long}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# AWS S3 / MinIO
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.bucket=${S3_BUCKET:aroggo-files}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:minioadmin}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:minioadmin}

# ML service
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# WebSocket
spring.websocket.path=/ws

# Server
server.port=8080
